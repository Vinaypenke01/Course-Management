{% extends 'core/base.html' %}

{% block content %}
<h2>Confirm Delete</h2>
<p>Are you sure you want to delete <strong>{{ module.title }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'module-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
