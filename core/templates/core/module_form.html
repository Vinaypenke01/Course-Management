{% extends 'core/base.html' %}

{% block content %}
<h2>Create a New Module</h2>

<form method="post">
    {% csrf_token %}
    
    <!-- Course Selection -->
    <div class="form-group">
        <label for="id_course">Course</label>
        <select name="course" id="id_course" class="form-control" required>
            {% for course in courses %}
                <option value="{{ course.id }}">{{ course.name }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Title Field -->
    <div class="form-group">
        <label for="id_title">Title</label>
        <input type="text" name="title" id="id_title" class="form-control" required>
    </div>

    <!-- Description Field -->
    <div class="form-group">
        <label for="id_description">Description</label>
        <textarea name="description" id="id_description" class="form-control" required></textarea>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary">Save Module</button>
</form>

{% endblock %}
