<!-- templates/core/base.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Course Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background: #f8f9fa; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav a { margin-right: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4">Online Course Management</h1>
    <nav class="mb-3">
        <a href="{% url 'course-list' %}">Courses</a>
        <a href="{% url 'module-list' %}">Modules</a>
        <a href="{% url 'lesson-list' %}">Lessons</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</div>
</body>
</html>
